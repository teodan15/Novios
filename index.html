<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para ti ❤️</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background: url('images/fondo-index.jpg') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Arial', sans-serif;
        }
        .container-index {
            background-color: rgba(13, 27, 42, 0.85);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.7);
            max-width: 500px;
            text-align: center;
            animation: fadeIn 1s;
            backdrop-filter: blur(5px);
            border: 1px solid #778da9;
        }
        h1 {
            color: #fff;
            font-size: 2.5rem;
            margin-bottom: 30px;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5);
        }
        #loginForm {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        #nombre {
            width: 80%;
            padding: 15px;
            margin: 10px 0;
            border: 2px solid #778da9;
            border-radius: 8px;
            font-size: 1.1rem;
            background-color: rgba(255, 255, 255, 0.9);
            text-align: center;
        }
        button[type="submit"] {
            background: linear-gradient(135deg, #4a6fa5, #3a5a8a);
            color: white;
            padding: 15px 40px;
            font-size: 1.2rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .corazon {
            color: #ff6b6b;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container-index">
        <h1>Hola!!!!<span class="corazon"></span>, tengo una sorpresa para ti.....</h1>
        <form id="loginForm">
            <input type="text" id="nombre" placeholder="¿Cómo te llamas?" required>
            <button type="submit">Descubrir sorpresa</button>
        </form>
    </div>
    <script src="js/index.js"></script>
</body>
</html>
